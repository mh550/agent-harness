# Optional (Michael installs it): removes what a crashed or stopped run left in its scratch after 3 days untouched. A run
# that finishes deletes its own scratch (finish); live.lock is a live project's flock file and is never aged out.
# The age rule runs from the user's systemd-tmpfiles-clean.timer (daily), disabled by default, hence the enable:
#   mkdir -p ~/.config/user-tmpfiles.d && cp templates/user/harness-tmpfiles.conf ~/.config/user-tmpfiles.d/harness.conf \
#     && systemd-tmpfiles --user --create && systemctl --user enable --now systemd-tmpfiles-clean.timer
# 3 days: longer than a 72 h run, so a running run's quiet files survive (decisions/2026-10-25-scratch-cleanup).
e /tmp/harness - - - 3d
x /tmp/harness/*/live.lock
